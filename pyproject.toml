[project]
name = "feeds"
version = "0.1.0"
description = "Versioned source packages for the CHD atlas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["polars>=1.43,<2", "jsonschema>=4"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feeds"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "sources"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["SIM905"]
